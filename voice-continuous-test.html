<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계속 듣기 시험</title>
<style>
  :root { --bg:#0b0d12; --card:#161a22; --line:#2a303c; --text:#eef0f4; --dim:#9aa3b2; --gold:#e0b84a; --gold2:#ffd54a; --red:#a94442; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; padding:14px; }
  h1 { font-size:21px; margin:2px 0 4px; color:var(--gold2); }
  .ver { font-size:12px; color:var(--dim); margin-bottom:10px; }
  .help { font-size:14px; line-height:1.55; color:var(--dim); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  label { display:block; font-size:14px; color:var(--dim); margin:10px 0 6px; }
  select { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:17px; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .modes button { padding:12px 6px; font-size:15px; }
  button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:14px; padding:16px 10px; font-size:18px; font-weight:800; font-family:inherit; }
  button.on { border-color:var(--gold); background:#2a2a1e; color:var(--gold2); }
  #go { width:100%; margin-top:12px; font-size:22px; background:var(--gold); color:#1a1a1a; border:none; }
  #go.stop { background:var(--red); color:#fff; }
  .counts { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; }
  .box b { display:block; font-size:30px; color:var(--gold2); }
  .box span { font-size:12px; color:var(--dim); line-height:1.3; display:block; }
  #out { margin-top:12px; min-height:150px; background:#4b5468; border-radius:14px; padding:14px; font-size:20px; font-weight:600; line-height:1.4; white-space:pre-wrap; }
  #interim { color:#c9cfdb; opacity:.75; }
  #raw { margin-top:8px; font-size:12px; color:var(--dim); white-space:pre-wrap; max-height:120px; overflow:auto; }
  #status { margin-top:10px; font-size:15px; color:var(--gold2); min-height:20px; }
</style>
</head>
<body>
<h1>🎤 계속 듣기 시험</h1>
<div class="ver">시험 v1 · 26-10-13 · 앱(index.html)과 별개, 앱 데이터는 건드리지 않음</div>

<div class="help">
1. 언어를 고르고 <b>시작</b>을 누르세요.<br>
2. 말하다가 3~5초씩 쉬면서 1분쯤 이야기해 보세요.<br>
3. "띵" 소리가 몇 번 나는지, 같은 말이 두 번 적히는지 보세요.<br>
4. 위쪽 <b>A</b>(새 방식)와 <b>B</b>(지금 앱 방식)를 번갈아 시험하면 차이가 보입니다.
</div>

<label>언어</label>
<select id="lang">
  <option value="ko-KR">🇰🇷 한국어</option>
  <option value="en-US">🇺🇸 English</option>
  <option value="ja-JP">🇯🇵 日本語</option>
  <option value="zh-CN">🇨🇳 中文</option>
  <option value="es-ES">🇪🇸 Español</option>
</select>

<label>방식</label>
<div class="modes">
  <button id="mA" class="on">A 계속 듣기<br><small>(새 방식)</small></button>
  <button id="mB">B 끊기면 다시 켜기<br><small>(지금 앱 방식)</small></button>
</div>

<button id="go">시작</button>

<div class="counts">
  <div class="box"><b id="cStart">0</b><span>마이크 켜짐<br>(띵 소리 횟수)</span></div>
  <div class="box"><b id="cEnd">0</b><span>폰이 스스로<br>마이크 끈 횟수</span></div>
  <div class="box"><b id="cSec">0</b><span>지난 시간<br>(초)</span></div>
</div>

<div id="status"></div>
<div id="out"><span id="final"></span><span id="interim"></span></div>
<div id="raw"></div>

<script>
  // 시험용 페이지입니다. 앱(index.html)과는 따로 동작합니다.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = id => document.getElementById(id);
  let mode = 'A', running = false, rec = null, starts = 0, ends = 0, t0 = 0, timer = null;
  let finals = [];   // 확정된 문장들 (중복 정리 후)
  let rawLog = [];   // 폰이 보내 준 그대로 (확인용)

  $('mA').onclick = () => setMode('A'); $('mB').onclick = () => setMode('B');
  function setMode(m) { if (running) return; mode = m; $('mA').classList.toggle('on', m === 'A'); $('mB').classList.toggle('on', m === 'B'); }

  // 같은 말이 겹쳐 오는 폰이 있어서, 새 문장이 앞 문장을 포함하면 앞 문장을 바꿔 끼움
  function addFinal(t) {
    t = t.trim(); if (!t) return;
    const last = finals[finals.length - 1];
    if (last && (t === last || last.endsWith(t))) return;      // 똑같은 말이 또 옴 → 무시
    if (last && t.startsWith(last)) { finals[finals.length - 1] = t; return; } // 앞 문장이 길어져서 옴 → 교체
    finals.push(t);
  }
  function show(interim) { $('final').textContent = finals.join(' '); $('interim').textContent = interim ? ' ' + interim : ''; }

  function listen() {
    if (!running) return;
    const r = new SR();
    r.lang = $('lang').value; r.interimResults = true; r.maxAlternatives = 1;
    r.continuous = (mode === 'A');
    let doneIdx = 0;
    r.onstart = () => { starts++; $('cStart').textContent = starts; $('status').textContent = '듣는 중… 말씀하세요'; };
    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) { if (i >= doneIdx) { rawLog.push(t.trim()); addFinal(t); doneIdx = i + 1; } }
        else interim += t;
      }
      show(interim); $('raw').textContent = '폰이 보낸 그대로: ' + rawLog.join(' | ');
    };
    r.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') $('status').textContent = '오류: ' + e.error; };
    r.onend = () => {
      if (rec !== r) return;
      if (running) { ends++; $('cEnd').textContent = ends; setTimeout(listen, 150); } // 폰이 스스로 끄면 다시 켬 (이때 띵 소리가 남)
    };
    rec = r;
    try { r.start(); } catch (err) { $('status').textContent = '시작 실패: ' + err.message; }
  }

  $('go').onclick = () => {
    if (!SR) { $('status').textContent = '이 브라우저는 음성 인식이 안 됩니다. 크롬으로 열어 주세요.'; return; }
    if (running) { running = false; const r = rec; rec = null; if (r) try { r.stop(); } catch (e) {} clearInterval(timer); $('go').textContent = '시작'; $('go').classList.remove('stop'); $('status').textContent = '멈춤'; show(''); return; }
    running = true; starts = 0; ends = 0; finals = []; rawLog = []; show(''); $('raw').textContent = '';
    $('cStart').textContent = 0; $('cEnd').textContent = 0; $('cSec').textContent = 0;
    t0 = Date.now(); timer = setInterval(() => { $('cSec').textContent = Math.round((Date.now() - t0) / 1000); }, 500);
    $('go').textContent = '멈춤'; $('go').classList.add('stop');
    listen();
  };
</script>
</body>
</html>
