    <title>알라딘 택시 V4.3 - 프리미엄 에디션</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        :root {
            /* -- base surfaces (deep ink, faint navy undertone) -- */
            --bg-color: #0a0b10;
            --card-bg: #14161d;
            --surface-2: #1b1e28;
            --table-border: rgba(255,255,255,0.055);
            --hairline: rgba(201,162,74,0.16);
            --hairline-soft: rgba(255,255,255,0.06);

            /* -- ink (warm parchment, not stark white) -- */
            --text-color: #ece5d6;
            --text-dim: #8d8c92;
            --text-faint: #5a5a63;

            /* -- accents -- */
            --accent-color: #c9a227;       /* antique brass — primary */
            --accent-bright: #e7c766;
            --accent-deep: #8a6a1c;
            --sapphire: #4a7796;           /* secondary — tour / info */
            --sapphire-bright: #6fa0c2;
            --emerald: #4b8467;            /* add */
            --ruby: #a24444;               /* delete */
            --slate: #5f6675;              /* neutral / edit */

            --major-grad: linear-gradient(150deg, #1c2230, #12151d);
            --premium-shadow: 0 14px 34px -16px rgba(0,0,0,0.65);
            --border-radius-lg: 16px;
            --border-radius-sm: 9px;
            --radius-xl: 20px;
        }
        * { box-sizing: border-box; }
        body {
            background:
                radial-gradient(circle at 50% -8%, rgba(201,162,74,0.06), transparent 55%),
                var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            overflow-x: hidden;
            letter-spacing: -0.2px;
        }
        header {
            padding: 10px 20px;
            height: 70px;
            text-align: center;
            border-bottom: 1px solid var(--hairline);
            font-size: 24px;
            font-weight: 800;
            position: sticky;
            top:0;
            background: rgba(10, 11, 16, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        #header-title {
            position: absolute; left: 112px; right: 60px; top: 50%; transform: translateY(-50%);
            text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-family: 'Noto Serif KR', serif;
            font-weight: 700;
            font-size: 21px;
            letter-spacing: 0.2px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent-color) 55%, var(--accent-deep));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .menu-btn { position: absolute; right: 20px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1001; padding: 5px; }
        .menu-btn div { width: 24px; height: 2px; background: var(--text-color); border-radius: 2px; opacity: 0.85; }
        #tour-btn {
            position: absolute;
            right: 8px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(150deg, #4a7796, #2f5670);
            color: #eef4f8;
            font-size: 14px;
            font-weight: 700;
