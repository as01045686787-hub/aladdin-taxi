    <title>알라딘 택시 V4.3 - 프리미엄 에디션</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        :root {
            /* -- base surfaces (deep ink, faint navy undertone) -- */
            --bg-color: #0a0b10;
            --card-bg: #14161d;
            --surface-2: #1b1e28;
            --table-border: rgba(255,255,255,0.055);
            --hairline: rgba(201,162,74,0.16);
            --hairline-soft: rgba(255,255,255,0.06);

            /* -- ink (warm parchment, not stark white) -- */
            --text-color: #ece5d6;
            --text-dim: #8d8c92;
            --text-faint: #5a5a63;

            /* -- accents -- */
            --accent-color: #c9a227;       /* antique brass — primary */
            --accent-bright: #e7c766;
            --accent-deep: #8a6a1c;
            --sapphire: #4a7796;           /* secondary — tour / info */
            --sapphire-bright: #6fa0c2;
            --emerald: #4b8467;            /* add */
            --ruby: #a24444;               /* delete */
            --slate: #5f6675;              /* neutral / edit */

            --major-grad: linear-gradient(150deg, #1c2230, #12151d);
            --premium-shadow: 0 14px 34px -16px rgba(0,0,0,0.65);
            --border-radius-lg: 16px;
            --border-radius-sm: 9px;
            --radius-xl: 20px;
        }
        * { box-sizing: border-box; }
        body {
            background:
                radial-gradient(circle at 50% -8%, rgba(201,162,74,0.06), transparent 55%),
                var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            overflow-x: hidden;
            letter-spacing: -0.2px;
        }
        header {
            padding: 10px 20px;
            height: 70px;
            text-align: center;
            border-bottom: 1px solid var(--hairline);
            font-size: 24px;
            font-weight: 800;
            position: sticky;
            top:0;
            background: rgba(10, 11, 16, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        #header-title {
            font-family: 'Noto Serif KR', serif;
            font-weight: 700;
            font-size: 21px;
            letter-spacing: 0.2px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent-color) 55%, var(--accent-deep));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .menu-btn { position: absolute; left: 20px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1001; padding: 5px; }
        .menu-btn div { width: 24px; height: 2px; background: var(--text-color); border-radius: 2px; opacity: 0.85; }
        #tour-btn {
            position: absolute;
            right: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(150deg, #4a7796, #2f5670);
            color: #eef4f8;
            font-size: 14px;
            font-weight: 700;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 101;
            box-shadow: 0 10px 22px -8px rgba(74, 119, 150, 0.55), inset 0 1px 0 rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
        }
        #search-trigger {
            position: absolute;
            right: 82px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--surface-2);
            color: var(--text-color);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 101;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid var(--hairline-soft);
            box-shadow: var(--premium-shadow);

            <div class="tr-lang-row" id="tr-lang-row"><span class="tr-from" onclick="swapTranslator()">Korean</span><button class="tr-swap" onclick="swapTranslator()" aria-label="번역 방향 바꾸기">⇄</button><select id="tr-lang" onchange="if (trReverse && recog) startVoiceInput()"></select></div>

    <div id="toast"></div>
    <script>
        // ---- 음성 기능이 없는 브라우저(카카오톡 안에서 열린 화면 등) 대비 ----
        // 음성 기능이 없으면 통역은 성공해도 음성 단계에서 멈춰 "통신 오류"로 보였음 → 글자 통역은 그대로 나오게 하고, 크롬으로 열도록 안내
        const NO_VOICE = !window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined';
        if (NO_VOICE) {
            try { if (!window.speechSynthesis) window.speechSynthesis = { speaking: false, pending: false, paused: false, cancel() {}, speak() {}, pause() {}, resume() {}, getVoices() { return []; } }; } catch (e) {}
            try { if (typeof window.SpeechSynthesisUtterance === 'undefined') window.SpeechSynthesisUtterance = function (t) { this.text = t; }; } catch (e) {}
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        const majorLangs = [
            {id:'en_us', name:'미국', flag:'🇺🇸'}, {id:'en_gb', name:'영국', flag:'🇬🇧'}, {id:'en_ca', name:'캐나다', flag:'🇨🇦'}, {id:'en_au', name:'호주', flag:'🇦🇺'}, {id:'en_sg', name:'싱가포르', flag:'🇸🇬'},
            {id:'en_in', name:'인도(영어)', flag:'🇮🇳'}, {id:'en_nz', name:'뉴질랜드', flag:'🇳🇿'}, {id:'en_ie', name:'아일랜드', flag:'🇮🇪'}, {id:'en_za', name:'남아공', flag:'🇺🇦'}, {id:'en_ph', name:'필리핀(영어)', flag:'🇵🇭'}
        ];
        const fixedOther = [{id:'ko', name:'한국', flag:'🇰🇷'}, {id:'tw', name:'대만', flag:'🇹🇼'}, {id:'ja', name:'일본', flag:'🇯🇵'}, {id:'zh', name:'중국', flag:'🇨🇳'}];
        const sortedOther = [
            {id:'vn', name:'베트남', flag:'🇻🇳'}, {id:'th', name:'태국', flag:'🇹🇭'}, {id:'ph', name:'필리핀(타갈)', flag:'🇵🇭'}, {id:'hk', name:'홍콩', flag:'🇭🇰'}, {id:'my', name:'말레이', flag:'🇲🇾'},
            {id:'id', name:'인도네시아', flag:'🇮🇩'}, {id:'ru', name:'러시아', flag:'🇷🇺'}, {id:'mn', name:'몽골', flag:'🇲🇳'}, {id:'uz', name:'우즈벡', flag:'🇺🇿'}, {id:'kz', name:'카자흐', flag:'🇰🇿'},
            {id:'fr', name:'프랑스', flag:'🇫🇷'}, {id:'de', name:'독일', flag:'🇩🇪'}, {id:'es', name:'스페인', flag:'🇪🇸'}, {id:'it', name:'이탈리아', flag:'🇮🇹'}, {id:'tr', name:'터키', flag:'🇹🇷'},
            {id:'ae', name:'UAE', flag:'🇦🇪'}, {id:'sa', name:'사우디', flag:'🇸🇦'}, {id:'in', name:'인도(힌어)', flag:'🇮🇳'}, {id:'br', name:'브라질', flag:'🇧🇷'}, {id:'mx', name:'멕시코', flag:'🇲🇽'},
            {id:'nl', name:'네덜란드', flag:'🇳🇱'}, {id:'se', name:'스웨덴', flag:'🇸🇪'}, {id:'pl', name:'폴란드', flag:'🇵🇱'}, {id:'cz', name:'체코', flag:'🇨🇿'}, {id:'eg', name:'이집트', flag:'🇪🇬'},
            {id:'pt', name:'포르투갈', flag:'🇵🇹'}, {id:'no', name:'노르웨이', flag:'🇳🇴'}, {id:'ne', name:'네팔', flag:'🇳🇵'}, {id:'mm', name:'미얀마', flag:'🇲🇲'}
        ].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
        const otherLangs = [...fixedOther, ...sortedOther];
        const enNames = {
            en_us:'United States', en_gb:'United Kingdom', en_ca:'Canada', en_au:'Australia', en_sg:'Singapore', en_in:'India (English)', en_nz:'New Zealand', en_ie:'Ireland', en_za:'South Africa', en_ph:'Philippines (English)',
            ko:'Korea', tw:'Taiwan', ja:'Japan', zh:'China', vn:'Vietnam', th:'Thailand', ph:'Philippines (Tagalog)', hk:'Hong Kong', my:'Malaysia', id:'Indonesia', ru:'Russia', mn:'Mongolia', uz:'Uzbekistan', kz:'Kazakhstan',
            fr:'France', de:'Germany', es:'Spain', it:'Italy', tr:'Türkiye (Turkey)', ae:'United Arab Emirates', sa:'Saudi Arabia', in:'India (Hindi)', br:'Brazil', mx:'Mexico', nl:'Netherlands', se:'Sweden', pl:'Poland', cz:'Czech Republic', eg:'Egypt',
            pt:'Portugal', no:'Norway', ne:'Nepal', mm:'Myanmar'
        };
        function countryLabel(id) { const c = [...majorLangs, ...otherLangs].find(x => x.id === id); return c ? `${c.flag} ${enNames[c.id] || ''}`.trim() : ''; }
        const langMap = {
            'en_us':'en', 'en_gb':'en', 'en_ca':'en', 'en_au':'en', 'en_sg':'en', 'en_in':'en', 'en_nz':'en', 'en_ie':'en', 'en_za':'en', 'en_ph':'en',
            'ko':'ko', 'tw':'zh-TW', 'ja':'ja', 'zh':'zh-CN', 'hk':'zh-HK', 'vn':'vi', 'th':'th', 'ph':'tl', 'my':'ms', 'id':'id', 'mm':'my',
            'de':'de', 'fr':'fr', 'es':'es', 'it':'it', 'nl':'nl', 'pt':'pt', 'pl':'pl', 'cz':'cs', 'se':'sv', 'tr':'tr', 'ru':'ru',
            'mn':'mn', 'uz':'uz', 'kz':'kk', 'ae':'ar', 'sa':'ar', 'eg':'ar', 'in':'hi', 'br':'pt', 'mx':'es', 'no':'no', 'ne':'ne'
        };
        let categories = JSON.parse(localStorage.getItem('taxi_v10_cats')) || ["인사", "목적지", "운행", "요금/결제", "환경/편의", "하차/주의", "긴급/기타"];
        let phraseDB = JSON.parse(localStorage.getItem('taxi_v10_db')) || {"인사": [{ko: "안녕하세요. 어디로 모실까요?"}]};
        let tourDB = JSON.parse(localStorage.getItem('taxi_v10_tour')) || [];
        let curL = '', lastL = '', lastSpeakLang = '', curC = categories[0], lastTranslated = '', isTourMode = false, selectedPhraseIdx = -1, selectedTourIdx = -1, isSearchActive = false, searchResults = [];

        // 영어권이라도 국가마다 관용적으로 쓰는 단어가 달라 번역 후 일부 어휘를 현지식으로 치환한다.
        // (구글 번역 자체는 영어 변형(en-GB 등)을 별도로 구분해 번역하지 않으므로, 번역 결과에 후처리를 적용)
        const britishStyleCountries = new Set(['en_gb', 'en_au', 'en_nz', 'en_ie', 'en_za', 'en_in', 'en_sg']);
        const usToBritishVocab = [
            [/\bgas station\b/gi, 'petrol station'],
            [/\btrunk\b/gi, 'boot'],
            [/\bsidewalk\b/gi, 'pavement'],
            [/\belevator\b/gi, 'lift'],
            [/\bparking lot\b/gi, 'car park'],
            [/\brestroom\b/gi, 'toilet'],
            [/\bcell ?phone\b/gi, 'mobile phone'],
            [/\bvacation\b/gi, 'holiday'],
            [/\bapartment\b/gi, 'flat'],
            [/\bgarbage\b/gi, 'rubbish'],
            [/\btrash can\b/gi, 'bin'],
            [/\bflashlight\b/gi, 'torch'],
            [/\btruck\b/gi, 'lorry']
        ];
        function caseAwareReplace(text, pattern, replacement) {
            return text.replace(pattern, (match) => {
                if (match[0] === match[0].toUpperCase() && match[0] !== match[0].toLowerCase()) {
                    return replacement.charAt(0).toUpperCase() + replacement.slice(1);
                }
                return replacement;
            });
        }
        function localizeEnglishVocab(text, countryId) {
            if (!britishStyleCountries.has(countryId)) return text;
            let result = text;
            usToBritishVocab.forEach(([pattern, replacement]) => { result = caseAwareReplace(result, pattern, replacement); });
            return result;
        }

        // 기기에 설치된 여러 TTS 음성 중, 해당 언어의 더 자연스러운(네트워크 기반) 음성을 우선 선택
        let cachedVoices = [];
        function refreshVoiceCache() { cachedVoices = window.speechSynthesis.getVoices() || []; }
        if ('speechSynthesis' in window) { refreshVoiceCache(); window.speechSynthesis.onvoiceschanged = refreshVoiceCache; }
        function pickBestVoice(langCode) {
            if (!cachedVoices.length) return null;
            const exact = cachedVoices.filter(v => v.lang.toLowerCase() === langCode.toLowerCase());
            const base = langCode.split('-')[0].toLowerCase();
            const baseMatch = cachedVoices.filter(v => v.lang.toLowerCase().startsWith(base));
            const pool = exact.length ? exact : baseMatch;
            if (!pool.length) return null;
            const networkVoice = pool.find(v => v.localService === false);
            return networkVoice || pool[0];
        }

        // ---- 휴대폰 뒤로가기(<): 앱 종료 대신 앱 내 이전 화면으로 이동 ----
        // 일부 기기(안드로이드 웹뷰 등)는 history.pushState가 간헐적으로 누락되거나, 뒤로가기 한 번에
        // 실제 history가 2단계 이상 소비되는 경우가 있어, 여유 버퍼(SENTINEL_BUFFER)를 유지해 흡수한다.
        // 화면이 열려있는 동안은 계속 버퍼를 채워두고, 완전히 홈으로 돌아오면 더 이상 채우지 않아 종료가 가능해진다.
        const SENTINEL_BUFFER = 6, SENTINEL_MAX = 30;
        let sentinelCount = 0, toastTimer = null, lastPopTime = 0;
        // 크롬·삼성인터넷은 '화면을 터치하지 않고 쌓은 뒤로가기 칸'을 무시하고 바로 앱을 종료시킨다.
        // 그래서 일반 브라우저에서는 화면을 터치할 때마다 한 칸씩만 쌓고, 카카오톡 같은 앱 안 화면에서는 기존처럼 자동으로 채운다.
        const IN_APP_VIEW = /; wv\)|KAKAOTALK|NAVER\(inapp|DaumApps/i.test(navigator.userAgent);
        function pushSentinel() {
            sentinelCount++;
            try { history.pushState({ app: 'top', n: sentinelCount }, '', location.pathname + location.search + '#s' + sentinelCount); }
            catch (e) { try { history.pushState({ app: 'top', n: sentinelCount }, ''); } catch (e2) { logNav('pushState 실패: ' + e2.message); } }
        }
        function ensureSentinel(mode) {
            if (!IN_APP_VIEW && mode !== 'init') return;
            while (sentinelCount < SENTINEL_BUFFER) pushSentinel();
        }
        document.addEventListener('click', () => { if (!IN_APP_VIEW && sentinelCount < SENTINEL_MAX) pushSentinel(); }, true);
        function anyLayerOpen() {
            const $ = id => document.getElementById(id);
            return $('category-popup').style.display === 'flex'
                || $('side-menu').classList.contains('active')
                || $('phrase-editor').style.display === 'flex'
                || $('tour-editor').style.display === 'flex'
                || $('display-overlay').style.display === 'flex'
                || $('translator-view').style.display === 'flex'
                || $('tour-view').style.display === 'flex'
                || !$('phrase-view').classList.contains('hidden');
        }
        function showToast(msg) { const el = document.getElementById('toast'); el.innerText = msg; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2000); }
        function openCategoryPopup() { ensureSentinel(3); document.getElementById('category-popup').style.display = 'flex'; }
        function closeCategoryPopup() { document.getElementById('category-popup').style.display = 'none'; }
        function selectCategory(c) { curC = c; selectedPhraseIdx = -1; renderTabs(); renderPhrases(); closeCategoryPopup(); }
        function closeTopLayer() {
            const $ = id => document.getElementById(id);
            if ($('category-popup').style.display === 'flex') { closeCategoryPopup(); return 'category-popup'; }
            if ($('side-menu').classList.contains('active')) { toggleMenu(); return 'side-menu'; }
            if ($('phrase-editor').style.display === 'flex') { closePhraseEditor(); return 'phrase-editor'; }
            if ($('tour-editor').style.display === 'flex') { closeTourEditor(); return 'tour-editor'; }
            if ($('display-overlay').style.display === 'flex') { closeDisplay(); return 'display-overlay'; }
            if ($('translator-view').style.display === 'flex') { closeTranslator(); return 'translator-view'; }
            if ($('tour-view').style.display === 'flex') {
                if ($('tour-search-input-container').style.display === 'flex') { toggleTourSearch(); return 'tour-search'; }
                closeTour(); return 'tour-view';
            }
            if (!$('phrase-view').classList.contains('hidden')) {
                if ($('search-input-container').style.display === 'flex') { toggleSearch(); return 'phrase-search'; }
                goHome(); return 'phrase-view';
            }
            return false;
        }
        // ---- 임시 진단용 화면 로그: 뒤로가기 문제 원인 파악 후 제거할 예정 ----
        const NAV_LOG_KEY = 'taxi_v10_navlog';
        function logNav(msg) {
            // 진단 로그는 어떤 경우에도 실제 내비게이션 동작을 방해하면 안 되므로 실패를 전부 무시한다.
            // 뒤로가기 중 앱이 그대로 꺼져버리는 경우에도 다음에 열었을 때 볼 수 있도록 localStorage에도 남긴다.
            try {
                const saved = JSON.parse(localStorage.getItem(NAV_LOG_KEY) || '[]');
                saved.push(`${new Date().toTimeString().slice(0,8)} ${msg}`);
                while (saved.length > 30) saved.shift();
                localStorage.setItem(NAV_LOG_KEY, JSON.stringify(saved));
            } catch (e) { /* 저장 실패는 무시 */ }
        }
        function showSavedNavLog() {
            try {
                const saved = JSON.parse(localStorage.getItem(NAV_LOG_KEY) || '[]');
                if (!saved.length) return;
                let box = document.getElementById('nav-debug');
                if (!box) {
                    box = document.createElement('div');
                    box.id = 'nav-debug';
                    box.style.cssText = 'position:fixed;left:4px;bottom:4px;z-index:99999;max-width:92vw;max-height:30vh;overflow:auto;background:rgba(0,0,0,0.85);color:#7CFC98;font:10px/1.4 monospace;padding:6px 8px;border-radius:6px;white-space:pre-wrap;pointer-events:none;';
                    (document.body || document.documentElement).appendChild(box);
                }
                const header = document.createElement('div');
                header.textContent = '--- 이전 세션 로그 (앱을 새로 열었을 때 자동 표시) ---';
                header.style.color = '#ffd166';
                box.appendChild(header);
                saved.forEach(m => { const l = document.createElement('div'); l.textContent = m; box.appendChild(l); });
            } catch (e) { /* 무시 */ }
        }
        window.addEventListener('pagehide', e => logNav(`PAGEHIDE persisted=${e.persisted}`));
        window.addEventListener('beforeunload', () => logNav('BEFOREUNLOAD'));
        window.addEventListener('popstate', () => {
            sentinelCount = Math.max(0, sentinelCount - 1);
            // 일부 기기(안드로이드 제스처 뒤로가기 등)는 한 번의 물리적 뒤로가기에 popstate가 두 번 연속 발생함.
            // 짧은 시간 안에 또 들어온 이벤트는 '가짜 중복'으로 보고 화면은 건드리지 않은 채 버퍼만 복구한다.
            const now = Date.now();
            const gap = lastPopTime ? now - lastPopTime : null;
            if (gap !== null && gap < 350) { ensureSentinel(); logNav(`dup +${gap}ms 무시 buf=${sentinelCount}`); return; }
            lastPopTime = now;
            const closed = closeTopLayer();
            ensureSentinel(); // 국기 화면에서도 다시 채워서 뒤로가기로 종료되지 않게 함
            logNav(`${gap===null?'start':'+'+gap+'ms'} ${closed ? 'close[' + closed + ']' : 'HOME(머무름)'} buf=${sentinelCount}${IN_APP_VIEW ? ' 앱안' : ''}`);
        });
        // ---- 통역 중 다른 앱으로 전환했다가 돌아오면, 끊긴 문장의 맨 앞부터 이어서 재생 ----
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible' || !resumeCtx) return;

            document.getElementById('tr-lang-row').classList.toggle('reversed', trReverse);
            const i = document.getElementById('tr-input');
            stopVoiceInput();
            if (i.value.trim()) runTranslator(); else startVoiceInput();
        }
        // ---- 번역기 아이콘: 손가락으로 끌어 위치 이동 (좌/우 가장자리에 붙고 위치 기억) ----
        let fabDragged = false;
        function applyFabPos() {
            const fab = document.getElementById('translator-fab'); let pos = null;
            try { pos = JSON.parse(localStorage.getItem('taxi_v10_fabpos')); } catch (e) {}
            if (!pos) return;
            const size = 52, m = 12, top = Math.min(Math.max(pos.top, m), Math.max(m, window.innerHeight - size - m));
            fab.style.top = top + 'px'; fab.style.bottom = 'auto';
            if (pos.side === 'l') { fab.style.left = m + 'px'; fab.style.right = 'auto'; } else { fab.style.right = m + 'px'; fab.style.left = 'auto'; }
        }
        function fabClick() { if (fabDragged) { fabDragged = false; return; } openTranslator(); }
        function initFab() {
            const fab = document.getElementById('translator-fab');
            applyFabPos(); window.addEventListener('resize', applyFabPos);
            let sx = 0, sy = 0, ox = 0, oy = 0, moving = false, pid;
            fab.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; const r = fab.getBoundingClientRect(); ox = r.left; oy = r.top; moving = false; pid = e.pointerId; try { fab.setPointerCapture(pid); } catch (err) {} });
            fab.addEventListener('pointermove', e => {
                if (pid === undefined || e.pointerId !== pid) return;
                const dx = e.clientX - sx, dy = e.clientY - sy;
                if (!moving && Math.hypot(dx, dy) > 8) moving = true;
                if (!moving) return;
                const size = 52, x = Math.min(Math.max(ox + dx, 4), window.innerWidth - size - 4), y = Math.min(Math.max(oy + dy, 4), window.innerHeight - size - 4);
                fab.style.left = x + 'px'; fab.style.top = y + 'px'; fab.style.right = 'auto'; fab.style.bottom = 'auto';
            });
            const end = e => {
                if (e.pointerId !== pid) return; pid = undefined;
                if (!moving) return; moving = false;
                fabDragged = true; setTimeout(() => { fabDragged = false; }, 350);
                const r = fab.getBoundingClientRect();
                try { localStorage.setItem('taxi_v10_fabpos', JSON.stringify({ side: (r.left + r.width / 2) < window.innerWidth / 2 ? 'l' : 'r', top: r.top })); } catch (err) {}
                applyFabPos();
            };
            fab.addEventListener('pointerup', end); fab.addEventListener('pointercancel', end);
        }
        function openTranslator() {
            trReverse = false; document.getElementById('tr-lang-row').classList.remove('reversed');
            ensureSentinel(3);
            const sel = document.getElementById('tr-lang'), saved = localStorage.getItem('taxi_v10_trlang');
            sel.value = (curL && curL !== 'ko' && langMap[curL]) ? curL : (saved || 'en_us');
            if (!sel.value) sel.value = 'en_us';
            document.getElementById('translator-view').style.display = 'flex';
            document.getElementById('tr-input').value = ''; showVoiceStatus('', false);
            startVoiceInput();
            if (!voiceSupported()) setTimeout(() => document.getElementById('tr-input').focus(), 60);
        }
        function closeTranslator() { stopVoiceInput(); const v = document.getElementById('translator-view'); v.style.display = 'none'; document.getElementById('tr-input').blur(); }
        function clearTranslator() { const i = document.getElementById('tr-input'); i.value = ''; startVoiceInput(); }
        function runTranslator() {
            const text = document.getElementById('tr-input').value.trim();
            if (!text) { showToast('번역할 텍스트를 입력하세요'); return; }
            const id = document.getElementById('tr-lang').value;
            try { localStorage.setItem('taxi_v10_trlang', id); } catch (e) {}
            stopVoiceInput(); document.getElementById('tr-input').blur();
            translateAndOpen(text, null, id, trReverse);
        }
        function selectTour(i) {
            if(selectedTourIdx === i) {
                showTour(i);
            } else {
                selectedTourIdx = i;
                const searchInput = document.getElementById('tour-search-input');
                if(searchInput && searchInput.value.trim()) {
                    filterTour(searchInput.value);
                } else {
                    renderTour();
                }
            }
        }

        function showTour(i){ isTourMode = true; translateAndOpen(tourDB[i].desc, tourDB[i].name); closeTour(); }
        function openTourEditor(idx = -1) { ensureSentinel(3); const targetIdx = idx === -1 ? -1 : selectedTourIdx; tourEditIdx = targetIdx; document.getElementById('edit-tour-name').value = targetIdx > -1 ? tourDB[targetIdx].name : ""; document.getElementById('edit-tour-desc').value = targetIdx > -1 ? tourDB[targetIdx].desc : ""; document.getElementById('tour-editor').style.display = 'flex'; }
        function closeTourEditor() { document.getElementById('tour-editor').style.display = 'none'; }
        function saveTourData() { const name = document.getElementById('edit-tour-name').value, desc = document.getElementById('edit-tour-desc').value; if(name && desc) { if(tourEditIdx > -1) { tourDB[tourEditIdx] = {name, desc}; selectedTourIdx = -1; } else { tourDB.unshift({name, desc}); selectedTourIdx = 0; } saveTour(); const searchInput = document.getElementById('tour-search-input').value; if(searchInput.trim()) { filterTour(searchInput); } else { renderTour(); } document.getElementById('tour-list').scrollTop = 0; closeTourEditor(); } }
        function moveTourToTop() { if(selectedTourIdx <= 0) return; const item = tourDB.splice(selectedTourIdx, 1)[0]; tourDB.unshift(item); selectedTourIdx = 0; saveTour(); const searchInput = document.getElementById('tour-search-input').value; if(searchInput.trim()) { filterTour(searchInput); } else { renderTour(); } document.getElementById('tour-list').scrollTop = 0; }
        function moveTour(dir) { if(selectedTourIdx === -1) return; const newIdx = selectedTourIdx + dir; if(newIdx >= 0 && newIdx < tourDB.length) { [tourDB[selectedTourIdx], tourDB[newIdx]] = [tourDB[newIdx], tourDB[selectedTourIdx]]; selectedTourIdx = newIdx; saveTour(); const searchInput = document.getElementById('tour-search-input').value; if(searchInput.trim()) { filterTour(searchInput); } else { renderTour(); } } }
        function deleteTour() { if(selectedTourIdx === -1) return; if(confirm("삭제할까요?")) { tourDB.splice(selectedTourIdx,1); selectedTourIdx=-1; saveTour(); const searchInput = document.getElementById('tour-search-input').value; if(searchInput.trim()) { filterTour(searchInput); } else { renderTour(); } } }

        async function translateAndOpen(text, title, langId, reverse) {
            const L = langId || curL, toKo = !!reverse; lastL = L;
            lastSpeakLang = toKo ? 'ko-KR' : getLangCode(L);
            const overlay = document.getElementById('display-overlay');
            const koDiv = document.getElementById('text-ko');
            const foreignDiv = document.getElementById('text-foreign');
            ensureSentinel(3); document.getElementById('text-country').innerText = countryLabel(toKo ? 'ko' : L); koDiv.innerText = title || text; foreignDiv.innerText = "번역 중..."; overlay.style.display = 'flex';
            document.getElementById('scroll-container').scrollTop = 0;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${toKo ? (langMap[L]||'en') : 'ko'}&tl=${toKo ? 'ko' : (langMap[L]||'en')}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                lastTranslated = data[0].map(p => p[0]).join('');
                if (!toKo && langMap[L] === 'en') lastTranslated = localizeEnglishVocab(lastTranslated, L);
                foreignDiv.innerText = lastTranslated;
                speak(lastTranslated, lastSpeakLang);
            } catch(e) { logNav(`번역오류 ${e && e.name}:${e && String(e.message).slice(0,60)}`); foreignDiv.innerText = "통신 오류가 발생했습니다."; }
        }
        // ---- 통역 음성 속도 / 스크롤 동기화 ----
        const SPEECH_RATE = 0.81; // 기존 0.85의 95%
        const BASE_MS_PER_CHAR = { en: 60, ko: 90, zh: 190, ja: 130, other: 75 }; // 속도 1.0 기준 글자당 소요 시간(초기 추정값)
        let speechCal = {};
        try { speechCal = JSON.parse(localStorage.getItem('taxi_v10_speechcal')) || {}; } catch (e) { speechCal = {}; }
        function saveSpeechCal() { try { localStorage.setItem('taxi_v10_speechcal', JSON.stringify(speechCal)); } catch (e) {} }
        function calKeyOf(l) { return l.startsWith('en') ? 'en' : l; }
        function baseKeyOf(l) { const p = l.split('-')[0]; return BASE_MS_PER_CHAR[p] ? p : 'other'; }
        function modelDuration(t, l) {
            const per = BASE_MS_PER_CHAR[baseKeyOf(l)];
            const soft = (t.match(/[,;:、，；：]/g) || []).length * 180;
            const hard = (t.match(/[.!?。！？…]/g) || []).length * 380;
            return (t.length * per + soft + hard) / SPEECH_RATE;
        }
        let speakToken = 0;
        let animationFrameId = null;
        let resumeCtx = null; // 다른 앱 전환 등으로 끊겼을 때 이어서 시작할 지점 정보
        function splitSentences(text) {
            const re = /[^.!?。！？…]+[.!?。！？…]*\s*/g; let m, idx = 0; const out = [];
            while ((m = re.exec(text))) { out.push({ start: idx, text: m[0] }); idx += m[0].length; }
            if (!out.length) out.push({ start: 0, text });
            return out;
        }
        function speak(t, l, offset = 0, fullOverride = null) {
            const token = ++speakToken;
            const fullText = fullOverride || t, fullLen = fullText.length;
            resumeCtx = { fullText, lang: l, offset };
            window.speechSynthesis.cancel(); if (animationFrameId) cancelAnimationFrame(animationFrameId);
            const u = new SpeechSynthesisUtterance(t); u.lang = l; u.pitch = 1.0; u.rate = SPEECH_RATE;
            const container = document.getElementById('scroll-container');
            const maxScroll = () => Math.max(0, container.scrollHeight - container.clientHeight);

            // 언어별 추정 재생시간 (+ 재생할 때마다 실제 시간으로 자가 보정)
            const model = modelDuration(t, l);
            const calKey = calKeyOf(l);
            const estDuration = Math.max(model * (speechCal[calKey] || 1), 500);

            let active = false, ended = false, fallbackStart = false, startPerf = 0, timeBase = null, displayProgress = 0;
            let advanceCount = 0, targetProgress = 0, lastBoundaryTime = 0, avgGap = 0.05;

            // 음성엔진이 실제 읽는 위치(charIndex)를 알려주면 우선 사용 (진행이 3회 이상 확인될 때만 신뢰)
            u.onboundary = (e) => {
                if (token !== speakToken || typeof e.charIndex !== 'number' || t.length === 0) return;
                const p = Math.min(e.charIndex / t.length, 1);
                if (p > targetProgress) {
                    const gap = p - targetProgress;
                    avgGap = advanceCount === 0 ? Math.max(gap, 0.01) : avgGap * 0.7 + gap * 0.3;
                    targetProgress = p; advanceCount++; lastBoundaryTime = performance.now();
                }
                if (resumeCtx) resumeCtx.offset = offset + e.charIndex;
            };

            function scrollLoop(ts) {
                if (!active || token !== speakToken) return;
                if (timeBase === null) timeBase = ts;
                let target = Math.min((ts - timeBase) / estDuration, 0.985);
                if (advanceCount >= 3 && ts - lastBoundaryTime < 2000) {
                    const extra = Math.min(Math.max(ts - lastBoundaryTime, 0) / estDuration, avgGap * 0.9);
                    target = Math.min(targetProgress + extra, 0.985);
                }
                const next = displayProgress + (target - displayProgress) * 0.2;
                if (next > displayProgress) displayProgress = next;
                const overall = fullLen ? Math.min((offset + next * t.length) / fullLen, 1) : next;
                container.scrollTop = overall * maxScroll();
                if (resumeCtx && advanceCount === 0) resumeCtx.offset = offset + next * t.length;
                animationFrameId = requestAnimationFrame(scrollLoop);
            }
            function startLoop(byFallback) {
                if (active || ended || token !== speakToken) return;
                active = true; fallbackStart = byFallback; startPerf = performance.now(); timeBase = null;
                animationFrameId = requestAnimationFrame(scrollLoop);
            }

            const bestVoice = pickBestVoice(l);
            if (bestVoice) u.voice = bestVoice;
            u.onstart = () => startLoop(false);
            u.onend = () => {
                if (token !== speakToken) return;
                ended = true;
                const wasActive = active, dur = performance.now() - startPerf;
                active = false; if (animationFrameId) cancelAnimationFrame(animationFrameId);
                container.scrollTop = maxScroll();
                resumeCtx = null; // 끝까지 들었으니 이어하기 정보는 폐기
                if (wasActive && !fallbackStart && dur > 600 && t.length >= 6 && model > 0) {
                    const ratio = Math.min(Math.max(dur / model, 0.4), 3);
                    const old = speechCal[calKey];
                    speechCal[calKey] = old ? old * 0.5 + ratio * 0.5 : ratio;
                    saveSpeechCal();
                }
            };
            u.onerror = () => { if (token !== speakToken) return; ended = true; active = false; if (animationFrameId) cancelAnimationFrame(animationFrameId); };
            window.speechSynthesis.speak(u);
            // 일부 기기는 onstart가 오지 않으므로 대비
            setTimeout(() => { if (token === speakToken && !active && !ended) startLoop(true); }, 1500);
        }
        function repeatVoice() { if (lastTranslated) speak(lastTranslated, lastSpeakLang || getLangCode(curL)); }
        function getLangCode(l) {
            const codes = {
                'en_us':'en-US', 'en_gb':'en-GB', 'en_ca':'en-CA', 'en_au':'en-AU', 'en_sg':'en-SG', 'en_in':'en-IN', 'en_nz':'en-NZ', 'en_ie':'en-IE', 'en_za':'en-ZA', 'en_ph':'en-PH',
                'ko':'ko-KR', 'tw':'zh-TW', 'ja':'ja-JP', 'zh':'zh-CN', 'hk':'zh-HK', 'vn':'vi-VN', 'th':'th-TH', 'ph':'tl-PH', 'my':'ms-MY', 'id':'id-ID', 'mm':'my-MM',
                'de':'de-DE', 'fr':'fr-FR', 'es':'es-ES', 'it':'it-IT', 'nl':'nl-NL', 'pt':'pt-PT', 'pl':'pl-PL', 'cz':'cs-CZ', 'se':'sv-SE', 'tr':'tr-TR', 'ru':'ru-RU',
                'mn':'mn-MN', 'uz':'uz-UZ', 'kz':'kk-KZ', 'ae':'ar-AE', 'sa':'ar-SA', 'eg':'ar-EG', 'in':'hi-IN', 'br':'pt-BR', 'mx':'es-MX', 'no':'no-NO', 'ne':'ne-NP'
            };
            return codes[l] || 'en-US';
        }
        function closeDisplay() { speakToken++; resumeCtx = null; if (animationFrameId) cancelAnimationFrame(animationFrameId); document.getElementById('display-overlay').style.display = 'none'; window.speechSynthesis.cancel(); if(isTourMode) { openTour(); isTourMode = false; } }
        function saveTour() { localStorage.setItem('taxi_v10_tour', JSON.stringify(tourDB)); }
        function saveData() { localStorage.setItem('taxi_v10_db', JSON.stringify(phraseDB)); }
        function saveCats() { localStorage.setItem('taxi_v10_cats', JSON.stringify(categories)); }
        function addCategory() { const n = prompt("새 카테고리 이름"); if(n) { categories.push(n); phraseDB[n]=[]; renderTabs(); saveCats(); saveData(); } }
        function editCategory() { const n = prompt("이름 수정", curC); if(n) { const i = categories.indexOf(curC); categories[i]=n; phraseDB[n]=phraseDB[curC]; delete phraseDB[curC]; curC=n; renderTabs(); saveCats(); saveData(); } }
        function deleteCategory() { if(confirm("카테고리를 삭제하면 안의 문장도 모두 삭제됩니다.")) { categories.splice(categories.indexOf(curC),1); delete phraseDB[curC]; curC=categories[0]||""; selectedPhraseIdx=-1; renderTabs(); renderPhrases(); saveCats(); saveData(); } }
        function moveCategory(dir) { const idx = categories.indexOf(curC), newIdx = idx + dir; if (newIdx >= 0 && newIdx < categories.length) { [categories[idx], categories[newIdx]] = [categories[newIdx], categories[idx]]; saveCats(); renderTabs(); } }
        function exportData() { const data = { db: phraseDB, cats: categories, tour: tourDB }; const blob = new Blob([JSON.stringify(data)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'taxi_backup.json'; a.click(); }
        function importData() { const input = document.createElement('input'); input.type = 'file'; input.onchange = e => { const reader = new FileReader(); reader.onload = f => { const data = JSON.parse(f.target.result); if(data.db) phraseDB = data.db; if(data.cats) categories = data.cats; if(data.tour) tourDB = data.tour; saveData(); saveCats(); saveTour(); location.reload(); }; reader.readAsText(e.target.files[0]); }; input.click(); }
        window.onload = init;
    </script>
</body>
