<!DOCTYPE html>
<!-- 알라딘 택시 도착 정보 | v0.4 · 26-10-19-01시 30분 · 공항열차도착정보 | 글자 크게·도착시간 강조·택시 앱 디자인·공항/열차 버튼에서 바로 진입 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0b10">
<title>도착 정보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #0a0b10;
    --card: #14161d;
    --surface-2: #1b1e28;
    --hairline: rgba(201,162,74,0.16);
    --hairline-strong: rgba(201,162,74,0.38);
    --hairline-soft: rgba(255,255,255,0.06);
    --text: #ece5d6;
    --dim: #8d8c92;
    --accent: #c9a227;
    --accent-bright: #e7c766;
    --accent-deep: #8a6a1c;
    --major-grad: linear-gradient(150deg, #1c2230, #12151d);
    --shadow: 0 14px 34px -16px rgba(0,0,0,0.65);
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(circle at 50% -8%, rgba(201,162,74,0.06), transparent 55%), var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
    letter-spacing: -0.2px;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-user-select: none;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    height: 70px; padding: 0 12px;
    display: grid; grid-template-columns: 56px minmax(0, 1fr) 72px; align-items: center;
    background: rgba(10, 11, 16, 0.92);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--hairline);
  }
  #back {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--hairline-soft); box-shadow: var(--shadow);
    font-size: 30px; line-height: 1; padding: 0 0 3px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #title {
    font-family: 'Noto Serif KR', "Noto Serif CJK KR", serif;
    font-weight: 700; font-size: 26px; letter-spacing: 0.2px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(135deg, var(--accent-bright), var(--accent) 55%, var(--accent-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #now {
    justify-self: end; font-size: 21px; font-weight: 800; color: var(--text);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .screen { display: none; padding: 16px 16px 40px; }
  .screen.active { display: block; }

  .section-title {
    color: var(--text); font-size: 22px; font-weight: 800;
    margin: 10px 0 16px 4px; display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .section-title::before { content: ""; width: 4px; height: 22px; background: var(--accent); border-radius: 2px; display: inline-block; }

  .card {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    width: 100%; min-height: 104px; margin: 0 0 12px; padding: 0 12px;
    background: var(--major-grad); color: var(--text);
    border: 1px solid var(--hairline-soft); border-radius: var(--radius); box-shadow: var(--shadow);
    font-family: inherit; font-size: 34px; font-weight: 800; text-align: center;
    white-space: nowrap; overflow: hidden; cursor: pointer;
  }
  .card:active { border-color: var(--accent); }
  .card.big { min-height: 150px; font-size: 40px; }
  .card .ico { font-size: 56px; line-height: 1; }

  .place {
    font-family: 'Noto Serif KR', "Noto Serif CJK KR", serif; font-weight: 700;
    font-size: 38px; text-align: center; margin: 14px 0 6px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .meta { text-align: center; color: var(--dim); font-size: 20px; font-weight: 700; margin: 0 0 18px; white-space: nowrap; }
  .meta .tag { color: var(--accent-bright); font-weight: 800; }

  .row {
    background: var(--card); border: 1.5px solid #ffffff; border-radius: var(--radius);
    padding: 16px 18px 18px; margin-bottom: 12px;
  }
  .row .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row .arr { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .row .arr small { color: var(--dim); font-size: 20px; font-weight: 800; }
  .row .arr b { font-size: 46px; font-weight: 900; line-height: 1.05; color: var(--accent-bright); font-variant-numeric: tabular-nums; }
  .row .from { font-size: 28px; font-weight: 800; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 21px; font-weight: 600; color: var(--dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .dep { display: flex; align-items: center; justify-content: space-between; gap: 10px; white-space: nowrap; margin-bottom: 8px; }
  .row .dep .st { font-size: 30px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; }
  .row .dep .tm { font-size: 30px; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
  .line { display: flex; justify-content: space-between; align-items: center; gap: 10px; white-space: nowrap; }
  .line .lbl { font-size: 26px; font-weight: 800; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .line .lbl.big { font-size: 26px; }
  .line .tm { font-size: 30px; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
  .line .tm2 { font-size: 50px; font-weight: 900; line-height: 1.05; color: var(--accent-bright); font-variant-numeric: tabular-nums; }
  .row .sub { margin-top: 8px; }
  .chip {
    display: inline-block; padding: 6px 16px; border-radius: 999px;
    font-size: 20px; font-weight: 800; white-space: nowrap;
    border: 1px solid var(--hairline-strong); color: var(--text);
  }
  .chip.late { background: var(--accent); border-color: var(--accent); color: #1a1305; }
  .empty { text-align: center; color: var(--text); font-size: 24px; font-weight: 700; padding: 32px 0; }

  .refresh-wrap { text-align: center; margin: 22px 0 4px; }
  .refresh {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 16px 40px; font-family: inherit; font-size: 28px; font-weight: 900; white-space: nowrap;
    background: var(--accent); color: #1a1305; border: none; border-radius: 14px; cursor: pointer;
  }
  .refresh:active { background: var(--accent-bright); }
  footer { text-align: center; color: var(--dim); font-size: 16px; font-weight: 600; line-height: 1.6; padding: 22px 12px 32px; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>

<header>
  <button id="back" data-act="back" aria-label="뒤로">←</button>
  <div id="title">도착 정보</div>
  <span id="now"></span>
</header>

<!-- 공항/열차 직접 선택 (택시 앱 버튼 없이 열었을 때만 보임) -->
<section class="screen" id="s-home">
  <button class="card big" data-act="kind" data-kind="airport"><span class="ico">✈️</span><span>공항</span></button>
  <button class="card big" data-act="kind" data-kind="train"><span class="ico">🚆</span><span>열차</span></button>
</section>

<!-- 지역 선택 -->
<section class="screen" id="s-regions">
  <div class="section-title" id="regions-label"></div>
  <div id="regions-list"></div>
</section>

<!-- 공항·역 선택 -->
<section class="screen" id="s-places">
  <div class="section-title" id="places-label"></div>
  <div id="places-list"></div>
</section>

<!-- 국내선·국제선 선택 (공항만) -->
<section class="screen" id="s-scope">
  <div class="place" id="scope-place"></div>
  <div class="section-title">노선 선택</div>
  <div id="scope-list"></div>
</section>

<!-- 도착 목록 -->
<section class="screen" id="s-result">
  <div class="place" id="result-place"></div>
  <div class="meta" id="result-meta"></div>
  <div id="result-list"></div>
  <div class="refresh-wrap"><button class="refresh" data-act="refresh">새로고침</button></div>
</section>

<footer>도착 정보 v0.7<br>26-10-19-20시 10분 · 공항열차도착정보</footer>

<script>
/* ===== 지역 묶음 ===== */
const AIRPORT_REGIONS = {
  "서울·인천·김포": [
    { name: "인천국제공항", code: "ICN" },
    { name: "김포공항", code: "GMP" }
  ],
  "대구·경북": [
    { name: "대구공항", code: "TAE" },
    { name: "포항경주공항", code: "KPO" }
  ],
  "대전·충청": [
    { name: "청주공항", code: "CJJ" }
  ],
  "부산·경남": [
    { name: "김해공항", code: "PUS" },
    { name: "사천공항", code: "HIN" },
    { name: "울산공항", code: "USN" }
  ],
  "광주·전라": [
    { name: "광주공항", code: "KWJ" },
    { name: "무안공항", code: "MWX" },
    { name: "여수공항", code: "RSU" },
    { name: "군산공항", code: "KUV" }
  ],
  "강원": [
    { name: "양양공항", code: "YNY" },
    { name: "원주공항", code: "WJU" }
  ],
  "제주": [
    { name: "제주공항", code: "CJU" }
  ]
};

const TRAIN_REGIONS = {
  "서울": ["서울역", "용산역", "청량리역", "수서역"],
  "경기·강원": ["광명역", "원주역", "강릉역"],
  "대전·충청": ["대전역", "오송역", "천안아산역"],
  "대구·경북": ["동대구역", "신경주역", "경주역"],
  "부산·경남": ["부산역", "부전역", "신해운대역", "센텀역", "기장역", "구포역", "밀양역"],
  "울산": ["울산역"],
  "광주·전라": ["광주송정역", "익산역", "전주역", "목포역", "여수엑스포역"]
};

const KIND = {
  airport: { label: "공항", regions: AIRPORT_REGIONS },
  train:   { label: "열차", regions: TRAIN_REGIONS }
};

/* ===== 실제 데이터 (Worker 중계) ===== */
const API = "https://hidden-shadow-7539.as01045686787.workers.dev";
const cache = {};
async function loadData(key, path) {
  if (cache[key] && Date.now() - cache[key].at < 300000) return cache[key].data;
  const r = await fetch(API + path);
  if (!r.ok) throw new Error("http " + r.status);
  const data = await r.json();
  cache[key] = { at: Date.now(), data };
  return data;
}
function uniq(rows) {
  const seen = new Set();
  return rows.filter(r => { const k = r.no + r.arr + r.from; if (seen.has(k)) return false; seen.add(k); return true; });
}

/* ===== 시각 ===== */
function nowText() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function tick() { document.getElementById("now").textContent = nowText(); }
tick(); setInterval(tick, 30000);

/* ===== 화면 이동 (폰 뒤로가기 버튼도 같은 순서로 동작) ===== */
const params = new URLSearchParams(location.search);
const ENTRY = KIND[params.get("type")] ? params.get("type") : null;
let state = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function setTitle(t) { document.getElementById("title").textContent = t; }

function show(st) {
  state = st;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(st.id).classList.add("active");

  if (st.id === "s-home") {
    setTitle("도착 정보");
  } else if (st.id === "s-regions") {
    setTitle(KIND[st.kind].label + " 도착");
    document.getElementById("regions-label").textContent = "지역 선택";
    document.getElementById("regions-list").innerHTML = Object.keys(KIND[st.kind].regions).map(r =>
      `<button class="card" data-act="region" data-kind="${st.kind}" data-region="${esc(r)}">${esc(r)}</button>`
    ).join("");
  } else if (st.id === "s-places") {
    setTitle(st.region);
    document.getElementById("places-label").textContent = KIND[st.kind].label + " 선택";
    const items = KIND[st.kind].regions[st.region];
    document.getElementById("places-list").innerHTML = items.map(it => {
      const name = st.kind === "airport" ? it.name : it;
      const code = st.kind === "airport" ? it.code : "";
      return `<button class="card" data-act="place" data-kind="${st.kind}" data-name="${esc(name)}" data-code="${code}">${esc(name)}</button>`;
    }).join("");
  } else if (st.id === "s-scope") {
    setTitle("공항 도착");
    document.getElementById("scope-place").textContent = st.name;
    document.getElementById("scope-list").innerHTML =
      ["국내선", "국제선"].map(sc =>
        `<button class="card big" data-act="scope" data-name="${esc(st.name)}" data-code="${st.code}" data-scope="${sc}"><span class="ico">${sc === "국내선" ? "🛫" : "🌏"}</span><span>${sc}</span></button>`
      ).join("");
  } else if (st.id === "s-result") {
    setTitle(KIND[st.kind].label + " 도착");
    renderResult();
  }
  window.scrollTo(0, 0);
}

function go(st) { history.pushState(st, ""); show(st); }

function goBack() {
  if (state && state.root) { location.replace("../"); }   // 처음 화면에서 뒤로 = 택시 앱으로
  else { history.back(); }
}

window.addEventListener("popstate", e => { if (e.state) show(e.state); });

/* ===== 도착 목록 ===== */
async function renderResult() {
  const st = state;
  const now = nowText();
  const listEl = document.getElementById("result-list");
  document.getElementById("result-place").textContent = st.kind === "airport" ? st.name + " " + st.scope : st.name;
  document.getElementById("result-meta").innerHTML = "현재 이후 도착 · <span class=\"tag\">시간표 기준</span>";
  listEl.innerHTML = '<div class="empty">불러오는 중...</div>';

  let rows = [], msg = "";
  try {
    if (st.kind === "airport") {
      if (st.code === "ICN") {
        const d = await loadData("incheon", "/airport/incheon");
        rows = (d.rows || []).map(r => ({ ...r, arr: r.arr, from: r.from, no: r.no, airline: r.airline }));
      }
      else if (st.code !== "PUS") msg = "이 공항은 아직 연결되지 않았습니다";
      else {
        const d = await loadData("gimhae", "/airport/gimhae");
        rows = (d.rows || []).filter(r => r.dom === (st.scope === "국내선"));
      }
    } else {
      if (st.name !== "부산역") msg = "이 역은 아직 연결되지 않았습니다";
      else {
        const d = await loadData("train", "/train?from=NAT010000&to=NAT014445");
        rows = (d.rows || []).map(r => ({ ...r, from: "서울역", sub: r.kind + " " + r.no }));
      }
    }
  } catch (e) {
    msg = "정보를 불러오지 못했습니다. 새로고침을 눌러 주세요";
  }
  if (msg) { listEl.innerHTML = `<div class="empty">${esc(msg)}</div>`; return; }

  rows = uniq(rows.filter(r => r.arr >= now)).sort((x, y) => (x.arr < y.arr ? -1 : 1));
  listEl.innerHTML = rows.length
    ? rows.map(r => {
        const sub = st.kind === "train" ? esc(r.sub) : esc(r.no) + " · " + esc(r.airline || "");
        const head = st.kind === "train"
          ? `<div class="line"><span class="lbl">${esc(r.from)} 출발</span><span class="tm">${esc(r.dep)}</span></div>`
          : `<div class="line"><span class="lbl">${esc(r.from)}</span></div>`;
        const arrLbl = st.kind === "train" ? esc(st.name) + " 도착" : "도착";
        return `<div class="row">
          ${head}
          <div class="line"><span class="lbl big">${arrLbl}</span><span class="tm2">${esc(r.arr)}</span></div>
          <div class="sub">${sub}</div>
        </div>`;
        }).join("")
    : '<div class="empty">현재 이후 도착 예정이 없습니다</div>';
}

/* ===== 버튼 처리 ===== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const d = b.dataset;
  if (d.act === "back") goBack();
  else if (d.act === "kind") go({ id: "s-regions", kind: d.kind });
  else if (d.act === "region") go({ id: "s-places", kind: d.kind, region: d.region });
  else if (d.act === "place") {
    if (d.kind === "airport") go({ id: "s-scope", kind: d.kind, name: d.name, code: d.code });
    else go({ id: "s-result", kind: d.kind, name: d.name, code: d.code });
  }
  else if (d.act === "scope") go({ id: "s-result", kind: "airport", name: d.name, code: d.code, scope: d.scope });
  else if (d.act === "refresh") { Object.keys(cache).forEach(k => delete cache[k]); renderResult(); tick(); }
});

/* ===== 시작: 택시 앱 버튼(?type=airport / ?type=train)으로 열면 바로 지역 선택 화면 ===== */
const rootState = ENTRY ? { id: "s-regions", kind: ENTRY, root: true } : { id: "s-home", root: true };
history.replaceState(rootState, "");
show(rootState);
</script>

<!-- 방: 공항열차도착정보 · v0.7 · 26-10-19-20시 10분 -->
</body>
</html>
